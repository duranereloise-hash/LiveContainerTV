name: Build LiveContainerTV IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build IPA
    runs-on: macos-latest
    env:
      scheme: LiveContainer
      archive_path: archive
    outputs:
      artifact: ${{ env.scheme }}.ipa

    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Patch xcconfig (optional)
        run: |
          TEAM="${{ vars.DEVELOPMENT_TEAM }}"
          if [ -n "$TEAM" ]; then
            sed -i '' "s/DEVELOPMENT_TEAM\[config=Debug\] = .*/DEVELOPMENT_TEAM[config=Debug] = $TEAM/" xcconfigs/Global.xcconfig
            sed -i '' "s/DEVELOPMENT_TEAM\[config=Release\] = .*/DEVELOPMENT_TEAM[config=Release] = $TEAM/" xcconfigs/Global.xcconfig
          fi

      - name: Archive
        run: |
          TEAM="${{ vars.DEVELOPMENT_TEAM }}"
          if [ -z "$TEAM" ]; then
            # No dev team configured → build without signing.
            # IPA will be re-signed by AltStore/SideStore on user's device.
            xcodebuild archive \
              -archivePath "$archive_path" \
              -scheme "$scheme" \
              -project LiveContainer.xcodeproj \
              -sdk iphoneos -arch arm64 \
              -configuration Release \
              CODE_SIGNING_ALLOWED=NO \
              | xcpretty && exit ${PIPESTATUS[0]}
          else
            xcodebuild archive \
              -archivePath "$archive_path" \
              -scheme "$scheme" \
              -project LiveContainer.xcodeproj \
              -sdk iphoneos -arch arm64 \
              -configuration Release \
              DEVELOPMENT_TEAM="$TEAM" \
              | xcpretty && exit ${PIPESTATUS[0]}
          fi

      - name: Create IPA (standalone)
        run: |
          mkdir Payload
          cp -R "$archive_path.xcarchive/Products/Applications/LiveContainer.app" Payload/
          zip -r "$scheme.ipa" Payload -x "._*" -x ".DS_Store" -x "__MACOSX"
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.scheme }}.ipa
          path: ${{ env.scheme }}.ipa